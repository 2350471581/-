name: 构建并发布

on:
  push:
    tags:
      - 'v*'  # 推送 v1.2, v1.3 等 tag 时触发

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 构建 Release APK
        run: |
          # 创建 release keystore（从 secrets 还原）
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          chmod 600 release.keystore
          ./gradlew assembleRelease --quiet

      - name: 计算 MD5
        id: md5
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build -name "记账助手.apk" | head -1)
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "md5=$(md5sum "$APK" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "apk_size=$(stat -c%s "$APK")" >> $GITHUB_OUTPUT

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.md5.outputs.apk_path }}
          generate_release_notes: true

      - name: 上传到阿里云 OSS
        if: ${{ secrets.OSS_KEY != '' }}
        uses: tvrcgo/upload-to-oss@v1
        with:
          key-id: ${{ secrets.OSS_KEY }}
          key-secret: ${{ secrets.OSS_SECRET }}
          bucket: ${{ secrets.OSS_BUCKET }}
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          local-path: ${{ steps.md5.outputs.apk_path }}
          remote-path: apks/

      - name: 生成 version.json
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION_NAME=${TAG#v}
          VERSION_CODE=$(grep versionCode app/build.gradle.kts | grep -oP '\d+')
          MD5="${{ steps.md5.outputs.md5 }}"

          # 构建 multi-source 结构
          cat > version.json << EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "releaseNotes": "",
            "md5": "${MD5}",
            "sources": [
              {
                "url": "https://cdn.jsdelivr.net/gh/2350471581/-@${TAG}/${APK_FILENAME:-记账助手.apk}",
                "priority": 0,
                "label": "jsDelivr 镜像"
              },
              {
                "url": "https://github.com/2350471581/-/releases/download/${TAG}/${APK_FILENAME:-记账助手.apk}",
                "priority": 1,
                "label": "GitHub 直链"
              },
              {
                "url": "https://ghproxy.com/https://github.com/2350471581/-/releases/download/${TAG}/${APK_FILENAME:-记账助手.apk}",
                "priority": 2,
                "label": "ghproxy 备用"
              }
            ]
          }
          EOF

      - name: 提交 version.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "chore: update version.json for ${GITHUB_REF#refs/tags/}" || true
          git push
